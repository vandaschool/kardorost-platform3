map $upstream_http_referrer_policy $kardorost_referrer_policy {
    default $upstream_http_referrer_policy;
    "" strict-origin-when-cross-origin;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy $kardorost_referrer_policy always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 70s;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Referrer-Policy;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location ^~ /storage/ {
        return 404;
    }
}
